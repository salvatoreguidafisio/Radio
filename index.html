<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Radio Italia</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Radio">
<meta name="theme-color" content="#E4572E">
<style>
:root{--bg:#F3F6F8;--card:#fff;--ink:#14202B;--muted:#5C6B78;--line:#DCE3E8;--ac:#E4572E;--acink:#fff;
 font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
@media(prefers-color-scheme:dark){:root{--bg:#0F1720;--card:#18232E;--ink:#E9EEF2;--muted:#93A3B1;--line:#2A3A48;--ac:#FF7A59;--acink:#0F1720;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{padding:calc(env(safe-area-inset-top,0px) + 1rem) 1rem calc(8rem + env(safe-area-inset-bottom,0px));max-width:46rem;margin:0 auto}
h1{font-size:1.7rem;margin:.2rem 0 1rem}
input{width:100%;padding:.85rem 1rem;font-size:1rem;border:1.5px solid var(--line);border-radius:.7rem;background:var(--card);color:var(--ink)}
.tabs{display:flex;gap:.5rem;margin:.9rem 0}
.tabs button{flex:1;padding:.7rem;font-size:1rem;font-weight:600;border:1.5px solid var(--line);border-radius:.7rem;background:var(--card);color:var(--ink)}
.tabs button.on{background:var(--ac);border-color:var(--ac);color:var(--acink)}
ul{list-style:none;margin:0;padding:0}
li{display:flex;align-items:center;gap:.4rem;background:var(--card);border:1px solid var(--line);border-radius:.8rem;margin-bottom:.55rem}
li.cur{border-color:var(--ac);box-shadow:0 0 0 1.5px var(--ac)}
.go{flex:1;display:flex;align-items:center;gap:.8rem;padding:.7rem;background:none;border:0;color:inherit;text-align:left;font:inherit;min-width:0}
.lg{width:2.8rem;height:2.8rem;border-radius:.6rem;background:var(--line);flex:none;display:grid;place-items:center;font-weight:700;overflow:hidden}
.lg img{width:100%;height:100%;object-fit:contain}
.nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tg{font-size:.85rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.st{background:none;border:0;font-size:1.6rem;padding:.5rem .9rem;color:var(--ac)}
.msg{color:var(--muted);text-align:center;padding:1.5rem 0}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:.8rem 1rem calc(.8rem + env(safe-area-inset-bottom,0px))}
.bar>div{max-width:46rem;margin:0 auto;display:flex;align-items:center;gap:.9rem}
#pp{width:3.4rem;height:3.4rem;border-radius:50%;border:0;background:var(--ac);color:var(--acink);font-size:1.4rem;flex:none}
#now{flex:1;min-width:0}
#err{color:var(--ac);font-size:.85rem}
</style>
</head>
<body>
<h1>Radio Italia</h1>
<input id="q" type="search" placeholder="Cerca una radio" autocomplete="off">
<div class="tabs"><button id="t-all" class="on">Tutte</button><button id="t-fav">Preferiti</button></div>
<ul id="list"></ul>
<div id="info" class="msg"></div>
<div class="bar"><div>
 <button id="pp" aria-label="Riproduci o metti in pausa" disabled>▶</button>
 <div id="now"><div class="nm" id="nm">Scegli una radio</div><div class="tg" id="tg"></div><div id="err"></div></div>
</div></div>
<audio id="a"></audio>
<script>
const $=s=>document.querySelector(s),A=$('#a');
let H,list=[],tab='all',cur=null,favs=[];
try{favs=JSON.parse(localStorage.getItem('fav')||'[]')}catch(e){}
const save=()=>{try{localStorage.setItem('fav',JSON.stringify(favs))}catch(e){}};
async function hosts(){
 if(H)return H;
 try{const r=await fetch('https://all.api.radio-browser.info/json/servers');H=[...new Set((await r.json()).map(x=>x.name))].sort(()=>Math.random()-.5)}
 catch(e){H=['de1.api.radio-browser.info','de2.api.radio-browser.info','fi1.api.radio-browser.info']}
 return H}
async function api(p){
 for(const h of await hosts()){try{const r=await fetch('https://'+h+p);if(r.ok)return await r.json()}catch(e){}}
 throw new Error('api')}
const isFav=id=>favs.some(f=>f.id===id);
const letter=n=>(n||'?').trim().charAt(0).toUpperCase();
function render(){
 const q=$('#q').value.trim().toLowerCase();
 let items=tab==='fav'?favs.filter(s=>!q||s.name.toLowerCase().includes(q)):list;
 $('#list').innerHTML=items.map(s=>`<li class="${cur&&cur.id===s.id?'cur':''}" data-id="${s.id}">
  <button class="go"><span class="lg">${s.icon?`<img src="${s.icon}" alt="" loading="lazy" onerror="this.replaceWith('${letter(s.name)}')">`:letter(s.name)}</span>
  <span style="min-width:0"><div class="nm"></div><div class="tg"></div></span></button>
  <button class="st" aria-label="Preferito">${isFav(s.id)?'★':'☆'}</button></li>`).join('');
 [...$('#list').children].forEach((li,i)=>{li.querySelector('.nm').textContent=items[i].name;li.querySelector('.tg').textContent=items[i].tags});
 $('#info').textContent=items.length?'':(tab==='fav'?'Nessun preferito: tocca la stella accanto a una radio.':'Nessuna radio trovata.');
 window._items=items}
async function load(){
 if(tab==='fav'){render();return}
 $('#info').textContent='Caricamento…';
 const q=$('#q').value.trim();
 try{
  const j=await api('/json/stations/search?countrycode=IT&hidebroken=true&is_https=true&order=clickcount&reverse=true&limit=80'+(q?'&name='+encodeURIComponent(q):''));
  list=j.filter(s=>(s.url_resolved||'').startsWith('https')&&!/ogg|flac|opus/i.test(s.codec||'')).map(s=>({id:String(s.stationuuid).replace(/[^\w-]/g,''),name:s.name.trim(),url:s.url_resolved,icon:(s.favicon||'').startsWith('https')?s.favicon.replace(/["'<>\s]/g,'%20'):'',tags:[s.state,s.tags&&s.tags.split(',').slice(0,2).join(', ')].filter(Boolean).join(' · ')}));
  render()}
 catch(e){list=[];render();$('#info').textContent='Impossibile caricare le radio. Controlla la connessione e riprova.'}}
function play(s){
 cur=s;$('#err').textContent='';$('#nm').textContent=s.name;$('#tg').textContent=s.tags;$('#pp').disabled=false;
 A.src=s.url;A.play().catch(()=>{$('#err').textContent='Stazione non raggiungibile, prova un’altra radio.'});
 api('/json/url/'+s.id).catch(()=>{});
 if('mediaSession'in navigator){navigator.mediaSession.metadata=new MediaMetadata({title:s.name,artist:'Radio Italia',artwork:[{src:'icon-512.png',sizes:'512x512',type:'image/png'}]});
  navigator.mediaSession.setActionHandler('play',()=>A.play());navigator.mediaSession.setActionHandler('pause',()=>A.pause())}
 render()}
$('#list').addEventListener('click',e=>{
 const li=e.target.closest('li');if(!li)return;
 const s=window._items.find(x=>x.id===li.dataset.id);
 if(e.target.closest('.st')){favs=isFav(s.id)?favs.filter(f=>f.id!==s.id):[...favs,s];save();render()}
 else if(e.target.closest('.go'))play(s)});
$('#pp').onclick=()=>A.paused?A.play():A.pause();
A.onplaying=()=>{$('#pp').textContent='⏸';$('#err').textContent=''};
A.onpause=()=>$('#pp').textContent='▶';
A.onerror=()=>{$('#err').textContent='Stazione non raggiungibile, prova un’altra radio.';$('#pp').textContent='▶'};
function setTab(t){tab=t;$('#t-all').classList.toggle('on',t==='all');$('#t-fav').classList.toggle('on',t==='fav');load()}
$('#t-all').onclick=()=>setTab('all');$('#t-fav').onclick=()=>setTab('fav');
let tm;$('#q').oninput=()=>{clearTimeout(tm);tm=setTimeout(load,400)};
load();
</script>
</body>
</html>
